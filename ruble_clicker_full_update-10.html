try{const n=JSON.parse(localStorage.getItem(KEY)||'null');if(n)S=merge(S,n)}catch{}

['red','🔴 Красный',100,'#dc2626'],['blue','🔵 Синий',100,'#2563eb'],['green','🟢 Зелёный',100,'#16a34a'],['yellow','🟡 Жёлтый',100,'#facc15'],['purple','🟣 Фиолетовый',100,'#9333ea'],['orange','🟠 Оранжевый',100,'#f59e0b'],
['rb','🔴🔵 Красно-синий',200,'linear-gradient(90deg,#dc2626,#8b1d2c,#2563eb)'],['turquoise','🩵 Бирюзовый',500,'#14b8a6'],['darkblue','🔵 Тёмно-синий',750,'#1e3a8a'],['pink','🩷 Розовый',1000,'#ec4899'],['camouflage','🪖 Камуфляж',1000,'repeating-linear-gradient(35deg,#3f6212 0 18px,#365314 18px 36px,#57534e 36px 54px,#1f2937 54px 72px)'],['lavender','🪻 Лавандовый',1250,'#a78bfa'],['gradient','🌈 Градиент',1500,'linear-gradient(135deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f)'],['rainbow','🌈 Радуга',2000,'conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)'],['black','⚫ Чёрный',2500,'#050505'],['white','⚪ Белый',2500,'#fff'],['gold','🟡 Золотой',5000,'linear-gradient(135deg,#b8860b,#ffe58a,#b8860b)'],['diamond','💎 Алмазный',10000,'linear-gradient(135deg,#cffafe,#fff,#67e8f9)'],['rick','🧪 Риковая кнопка',10000,'linear-gradient(135deg,#7aa6bf,#b9d0df 45%,#6b8496)']];

const sounds=[['none','🔇 Без звука'],['basic','🔊 Обычный'],['honey','🍯 Мёд'],['water','💧 Вода'],['snow','❄️ Снег'],['chocolate','🍫 Хруст шоколада'],['coin','🪙 Монета'],['cash','💰 Касса'],['click','🖱️ Клик'],['bell','🔔 Колокольчик'],['electronic','⚡ Электронный'],['bubble','🫧 Пузырёк'],['purchase','🛒 Покупка'],['gems','💎 Самоцветы'],['terminal','💳 Терминал'],['upgrade','🚀 Улучшение'],['shimmer','✨ Блеск'],['mechanism','⚙️ Механизм'],['boost','🔥 Буст'],['teleport','🌌 Телепорт'],['energy','💥 Энергия'],['win','🏆 Победа'],['fanfare','🎺 Фанфара'],['error','❌ Ошибка']];
const levelReq=[0,100,500,1000,2500,5000,10000,25000,50000,100000,250000,500000,1000000,2500000,5000000,10000000,25000000,50000000,100000000,250000000];
const levelReward=i=>i===2?100:i===3?200:i===4?500:i>=5?1000:0;
const titles=['Новичок','Тапер','Кликер','Продвинутый кликер','Мастер тапов','Эксперт','Грандмастер','Легенда','Император кликов'];
function prestigeBonus(){return S.prestige>=3?3.5:S.prestige===2?1.5:S.prestige===1?0.5:0}
function effectivePower(){return Number(S.power||1)+prestigeBonus()}
function totalClickReward(){let base=effectivePower();if(S.critical.owned&&Math.random()<.05){S.stats.criticalHits++;return base*5}return base}
function refreshHud(){const r=document.querySelector('.rub'),t=document.querySelector('.taps'),codeEl=document.querySelector('.code'),lev=document.querySelector('.levelline');if(r)r.textContent=money(S.rubles);if(t)t.textContent='🖱️ Тапов: '+Number(S.taps||0).toLocaleString('ru-RU')+' · 💎 '+Number(S.diamonds||0).toLocaleString('ru-RU');if(codeEl)codeEl.textContent=(S.vip?'👑 VIP ':'')+(S.playerCode||'')+' · '+(S.title||'Новичок');if(lev)lev.innerHTML='<b>Уровень '+Number(S.level||1)+'</b><div class="bar"><i style="width:'+levelProgress()+'%"></i></div><span class="small">'+levelText()+'</span>';updateEventBar()}
function doTap(){
  if(mode!=='main') return false;
  if(!document.getElementById('mainTap')) return false;
  resetTasksIfNeeded();
  if(!S || typeof S!=='object') return false;
  S.rubles=Number.isFinite(Number(S.rubles))?Number(S.rubles):0;
  S.taps=Number.isFinite(Number(S.taps))?Number(S.taps):0;
  S.totalEarned=Number.isFinite(Number(S.totalEarned))?Number(S.totalEarned):0;
  S.clicks=Number.isFinite(Number(S.clicks))?Number(S.clicks):0;
  S.power=Number.isFinite(Number(S.power))?Number(S.power):1;
  if(!S.stats||typeof S.stats!=='object')S.stats={roundWins:0,survivalWins:0,eventsWon:0,giftsSent:0,colorsBought:0,criticalHits:0};
  if(!S.weekly||typeof S.weekly!=='object')S.weekly={start:Date.now(),tasks:[],claimed:[],colors:0,taps:0,survivalWins:0};
  const gain=Math.max(0,Number(totalClickReward())||0);
  S.taps+=1;
  S.statsDailyTaps=(Number(S.statsDailyTaps)||0)+1;
  S.weekly.taps=(Number(S.weekly.taps)||0)+1;
  S.clicks+=1;
  S.rubles+=gain;
  S.dailyEarn=(Number(S.dailyEarn)||0)+gain;
  S.totalEarned+=gain;
  checkProgress();
  playSound('click');
  save();
  refreshHud();
  return true;
}
function checkProgress(){while(S.level<20&&S.taps>=levelReq[S.level]){S.level++;if(!S.claimedLevels.includes(S.level)){S.claimedLevels.push(S.level);const r=levelReward(S.level);S.rubles+=r;S.totalEarned+=r}};updateTasks();updateAchievements()}
function playSound(kind){if(S.sounds==='none')return;try{const C=window.AudioContext||window.webkitAudioContext;if(!window.__ac)window.__ac=new C();const c=window.__ac;const g=c.createGain();g.connect(c.destination);const o=c.createOscillator();o.connect(g);let t=c.currentTime;let map={click:[260,.055,.06],coin:[850,.09,.12],cash:[520,.1,.18],purchase:[700,.08,.12],bell:[900,.12,.35],electronic:[600,.05,.08],bubble:[420,.06,.1],gems:[1200,.13,.16],terminal:[320,.05,.12],upgrade:[500,.12,.25],shimmer:[1400,.15,.16],mechanism:[180,.07,.09],boost:[650,.15,.18],teleport:[140,.22,.15],energy:[480,.09,.3],win:[900,.18,.25],fanfare:[600,.3,.22],error:[130,.1,.2],honey:[300,.25,.12],water:[760,.08,.1],snow:[1500,.12,.06],chocolate:[110,.12,.16],basic:[520,.08,.08]}[S.sounds]||[520,.08,.08];o.type='sine';o.frequency.value=map[0];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(map[2],t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+map[1]);o.start(t);o.stop(t+map[1]+.02);if(S.sounds==='coin'||S.sounds==='purchase'||S.sounds==='win'||S.sounds==='fanfare'){const o2=c.createOscillator(),g2=c.createGain();o2.connect(g2);g2.connect(c.destination);o2.frequency.value=map[0]*1.5;g2.gain.setValueAtTime(.0001,t);g2.gain.exponentialRampToValueAtTime(.05,t+.02);g2.gain.exponentialRampToValueAtTime(.0001,t+.18);o2.start(t);o2.stop(t+.2)}}catch{}}

function closeModal(){const skillOverlay=mode==='survivalSkills';if(skillOverlay&&window.__surv){mode='survival';$('modalRoot').innerHTML='';return}if(mode==='survival'&&window.__surv){return}const wasRound=mode==='multiplayer'||mode==='survival';if(mode!=='main'){mode='main';stopRound();stopAuto();if(window.__surv){clearInterval(window.__surv.timer);clearTimeout(window.__surv.botTimer);window.__surv=null;}}$('modalRoot').innerHTML='';if(wasRound)renderMain();else refreshHud()}
let mode='main',round=null,autoTimer=null,eventTimer=null;
function renderMain(){const c=colors.find(x=>x[0]===S.color)||colors[5];let frame=frames.find(x=>x[0]===S.frame)||frames[0];$('app').innerHTML=`<div class="topbar"><button class="btn" id="settings">⚙️ Настройки</button><button class="btn" id="tasks">📋 Задания</button><button class="btn" id="daily">🎁 Ежедневный подарок</button></div><h1 class="title">💰 Рублёвый кликер</h1><div class="sub">Тапы и рубли — отдельные ресурсы</div><div class="wallet"><div class="rub">${money(S.rubles)}</div><div class="taps">🖱️ Тапов: ${S.taps.toLocaleString('ru-RU')} · 💎 ${S.diamonds}</div><div class="code">${S.vip?'👑 VIP ':''}${S.playerCode} · ${S.title}</div></div><div class="levelline"><b>Уровень ${S.level}</b><div class="bar"><i style="width:${levelProgress()}%"></i></div><span class="small">${levelText()}</span></div><div class="mainarea"><button class="tap" id="mainTap" style="background:${c[3]};color:${['yellow','orange','white','gold','diamond'].includes(S.color)?'#111827':'#fff'}">ТАП</button></div><div class="nav"><button class="btn" id="shop">🛒 Магазин</button><button class="btn" id="cosmetics">🔥 Эффекты, цвета и рамки 👾</button><button class="btn" id="multi">🎮 Мультиплеер</button><button class="btn" id="level">⭐ Уровень</button><button class="btn" id="stats">📊 Статистика</button><button class="btn" id="ach">🏆 Достижения</button></div><div class="nav2"><button class="btn" id="gifts">🎁 Подарки</button><button class="btn" id="profile">👤 Профиль</button><button class="btn" id="help">ℹ️ Правила</button><button class="btn" id="prestigeTop">♻️ Перерождение</button></div><div class="eventbar" id="eventbar"></div><div class="eventpanel hidden" id="eventPanel"></div>`; $('mainTap').onclick=doTap;$('shop').onclick=shopModal;$('cosmetics').onclick=cosmeticsModal;$('multi').onclick=multiModal;$('level').onclick=levelModal;$('stats').onclick=statsModal;$('ach').onclick=achModal;$('gifts').onclick=giftsModal;$('profile').onclick=profileModal;$('help').onclick=helpModal;$('settings').onclick function openMultiSetup(title,ds,target){$('multiContent').innerHTML=`<h3>${title}</h3><div class="grid">${ds.map(d=>`<button class="btn" onclick="startBotRound('${d[0]}',${d[2]},${d[3]},${target})">${d[1]}<br><span class="small">${d[2]} мс</span></button>`).join('')}</div><div class="section"><b>Время:</b> 30 сек по умолчанию. Для цели сложность также определяется выбранной скоростью.</div>${target?'<div class="section"><b>Цель:</b><div class="grid">'+[100,200,500,1000,2000,10000,100000].map(x=>`<button class="btn" onclick="setTarget(${x})">${x.toLocaleString('ru-RU')} ₽</button>`).join('')+'</div><div id="targetChoice" class="notice">Цель: 100 ₽</div></div>':''}`;window.__target=100}
function setTarget(n){window.__target=n;const e=$('targetChoice');if(e)e.textContent='Цель: '+money(n)}
function startBotRound(diff,rate,reward,isTarget){stopAuto();mode='multiplayer';round={kind:isTarget?'target':'bot',diff,rate,reward,target:window.__target||100,time:30,player:0,bot:0,end:Date.now()+30000,timer:null,botTimer:null};openModal('🎮 Раунд',`<div class="multihud"><div><b>🔵 ТЫ</b><div id="rPlayer">0 ₽</div></div><div><b id="rTime">30</b><div class="small">секунд</div></div><div class="botbox"><b>🔴 БОТ</b><div>скрыто</div></div></div><div class="mainarea"><button class="roundbtn" id="roundTap">ТАП</button></div><div class="notice">${isTarget?'Цель: '+money(round.target):'Набери больше бота'}</div><div id="roundStatus" class="small center"></div>`);$('roundTap').onclick=()=>{if(!round)return;round.player+=effectivePower();$('rPlayer').textContent=money(round.player);if(round.kind==='target'&&round.player>=round.target)finishRound(true)};round.timer=setInterval(()=>{if(!round)return;let left=Math.max(0,round.end-Date.now());$('rTime').textContent=Math.ceil(left/1000);if(left<=0)finishRound(false)},200);function bot(){if(!round)return;round.bot++;round.botTimer=setTimeout(bot,rate)}bot()}
function finishRound(forceWin){if(!round)return;clearInterval(round.timer);clearTimeout(round.botTimer);const r=round;round=null;let win=r.kind==='target'?forceWin||r.player>=r.target:r.player>r.bot;if(win){S.rubles+=r.reward;S.totalEarned+=r.reward;S.stats.roundWins++;S.dailyWins=(S.dailyWins||0)+1;S.weeklyWin=true;S.weekly.wins=(S.weekly.wins||0)+1;playSound('win')}save();openModal('🏁 Раунд завершён',`<div class="resultbox"><h3>${win?'🏆 Победа!':'😔 Раунд проигран'}</h3><p>Твои рубли: <b>${money(r.player)}</b></p><p>Бот: <b>${r.bot}</b></p><p>Награда: <b>${win?money(r.reward):'0 ₽'}</b></p></div><div class="center"><button class="btn" onclick="multiModal()">Вернуться в мультиплеер</button></div>`);updateTasks();renderMain()}
function stopRound(){if(round){clearInterval(round.timer);clearTimeout(round.botTimer);round=null}}
function survivalMode(){stopAuto();mode='survival';openModal('🌳 Выживание',`<div class="center"><button class="btn" onclick="survivalSkills()">🌳 Навыки</button><p>Твоя Survival-валюта: <b>${Math.floor(S.survival.money).toLocaleString('ru-RU')}</b></p><p>Престиж Survival: <b>${S.survival.prestige}</b> · постоянный бонус ×${S.survival.prestigeBonus}</p><button class="roundbtn" id="survTap">ТАП</button><p class="small">Во время раунда видна только твоя игровая кнопка. Бот, его счёт и его прокачка скрыты.</p><div id="survStatus" class="notice"></div></div>`);startSurvivalRound()}
function survivalMultiplier(){let m=1;if(S.survival.skills.x2)m=2;if(S.survival.skills.x4)m=4;if(S.survival.skills.x10)m=10;if(S.survival.skills.x15)m=15;return m*S.survival.prestigeBonus}
function survivalSpeed(){if(S.survival.skills.s40)return 40;if(S.survival.skills.s60)return 60;if(S.survival.skills.s90)return 90;return 1000}
function survivalLuck(){if(S.survival.skills.l3)return [15,2];if(S.survival.skills.l2)return [10,1.5];if(S.survival.skills.l1)return [5,1.5];return [0,1]}
function survivalCrit(){if(S.survival.skills.c5)return 40;if(S.survival.skills.c4)return 25;if(S.survival.skills.c3)return 15;if(S.survival.skills.c2)return 10;if(S.survival.skills.c1)return 5;return 0}
function survivalTap(){if(!window.__surv)return;const now=Date.now();const speed=survivalSpeed();if(window.__surv.lastTap&&now-window.__surv.lastTap<speed)return;window.__surv.lastTap=now;let g=survivalMultiplier();let [lp,lm]=survivalLuck();if(Math.random()<lp/100)g*=lm;if(Math.random()<survivalCrit()/100)g*=5;S.survival.money+=g;S.survival.totalMoney+=g;window.__surv.player++;$('survStatus').textContent='Survival-деньги: '+Math.floor(S.survival.money).toLocaleString('ru-RU')+' · тапы: '+window.__surv.player;save()}
function botBuySkill(){const b=S.survival.bot;const pool=[['x2',100],['s90',500],['c1',500],['x4',1000],['s60',1000],['c2',2000],['l1',0],['x10',5000],['c3',5000],['s40',10000],['x15',10000],['c4',15000],['c5',50000]];const available=pool.filter(x=>!b.skills[x[0]]&&(x[1]===0||b.money>=x[1]));if(!available.length)return;const [id,cost]=available[Math.floor(Math.random()*available.length)];if(cost)b.money-=cost,b.spent+=cost;b.skills[id]=true}
function botSurvivalMultiplier(){let m=1;if(S.survival.bot.skills.x2)m=2;if(S.survival.bot.skills.x4)m=4;if(S.survival.bot.skills.x10)m=10;if(S.survival.bot.skills.x15)m=15;return m}function botSurvivalLuck(){if(S.survival.bot.skills.l1&&Math.random()<.05)return 1.5;return 1}function botSurvivalCrit(){if(S.survival.bot.skills.c5)return 40;if(S.survival.bot.skills.c4)return 25;if(S.survival.bot.skills.c3)return 15;if(S.survival.bot.skills.c2)return 10;if(S.survival.bot.skills.c1)return 5;return 0}function botSurvivalSpeed(){if(S.survival.bot.skills.s40)return 40;if(S.survival.bot.skills.s60)return 60;if(S.survival.bot.skills.s90)return 90;return 1000}
function startSurvivalRound(){S.survival.bot=S.survival.bot||{money:0,taps:0,skills:{},spent:0};S.survival.bot.money=0;S.survival.bot.taps=0;S.survival.bot.skills={};S.survival.bot.spent=0;window.__surv={player:0,bot:0,end:Date.now()+60000};$('survTap').onclick=survivalTap;let botLoop=()=>{if(!window.__surv)return;const b=S.survival.bot;let g=botSurvivalMultiplier()*botSurvivalLuck();if(Math.random()<botSurvivalCrit()/100)g*=5;b.taps++;b.money+=g;if(Math.random()<.12)botBuySkill();window.__surv.bot=b.taps;window.__surv.botMoney=b.money;window.__surv.botTimer=setTimeout(botLoop,botSurvivalSpeed())};botLoop();window.__surv.timer=setInterval(()=>{if(!window.__surv)return;if(Date.now()>=window.__surv.end)finishSurvival()},250)}
function finishSurvival(){const r=window.__surv;if(!r)return;clearInterval(r.timer);clearTimeout(r.botTimer);window.__surv=null;let win=r.player>=r.bot;S.rubles+=win?200000:0;S.totalEarned+=win?200000:0;if(win){S.stats.survivalWins++;S.weekly.survivalWins=(S.weekly.survivalWins||0)+1;}updateTasks();save();const b=S.survival.bot||{};openModal('🌳 Survival — результат',`<div class="resultbox"><h3>${win?'🏆 Ты победил!':'😔 Бот победил'}</h3><p>Твои тапы: <b>${r.player}</b></p><p>Бот: <b>${r.bot}</b></p><p>Твоя Survival-валюта: <b>${Math.floor(S.survival.money).toLocaleString('ru-RU')}</b></p><p>Награда в обычных рублях: <b>${win?'200 000 ₽':'0 ₽'}</b></p><h3>🤖 Статистика слабого бота</h3><p>Натапал: ${b.taps||r.bot}</p><p>Survival-денег: ${Math.floor(b.money||0).toLocaleString('ru-RU')}</p><p>Потратил на навыки: ${Math.floor(b.spent||0).toLocaleString('ru-RU')}</p><p>Навыков куплено: ${Object.keys(b.skills||{}).length}</p><p>Прокачка и результат бота были скрыты до конца раунда.</p></div><div class="center"><button class="btn" onclick="survivalMode()">Новый Survival</button></div>`);renderMain()}
function survivalSkills(){const previousMode=mode;mode='survivalSkills';const skills=[['x2','×2',100],['x4','×4',1000],['x10','×10',5000],['x15','×15',10000],['s90','90 мс',500],['s60','60 мс',1000],['s40','40 мс',10000],['l1','Удача I · 5% +50%',0],['l2','Удача II · 10% +50%',0],['l3','Удача III · 15% +100%',0],['c1','Крит I · 5%',500],['c2','Крит II · 10%',2000],['c3','Крит III · 15%',5000],['c4','Крит IV · 25%',15000],['c5','Крит V · 40%',50000]];openModal('🌳 Дерево навыков',`<div class="center"><b>Survival-деньги: ${Math.floor(S.survival.money).toLocaleString('ru-RU')}</b><p class="small">Внесено в дерево: ${Math.floor(S.survival.progress||0).toLocaleString('ru-RU')} / 1 000 000</p><div class="bar" style="margin:10px 0"><i style="width:${clamp((S.survival.progress||0)/1000000*100,0,100)}%"></i></div><button class="roundbtn" style="width:95px;height:95px;font-size:18px;box-shadow:0 7px 0 #1d4ed8" onclick="depositSurvival()">Внести</button></div><div class="tree"><div class="branch"><h3 class="center">💰 Доход</h3>${skills.slice(0,4).map(s=>skillHtml(s)).join('')}</div><div class="branch"><h3 class="center">⚡ Скорость</h3>${skills.slice(4,7).map(s=>skillHtml(s)).join('')}</div><div class="branch"><h3 class="center">🍀 Удача</h3>${skills.slice(7,10).map(s=>skillHtml(s)).join('')}</div><div class="branch"><h3 class="center">💥 Критический шанс</h3>${skills.slice(10).map(s=>skillHtml(s)).join('')}</div><div class="branch wide"><h3 class="center">♻️ Survival-престиж</h3><div class="skill"><b>×2</b><small>10 000</small><button class="btn" onclick="survivalPrestige()">${S.survival.prestige?'Сделать снова':'Купить'}</button></div></div></div>`)}
function skillHtml(s){let [id,name,cost]=s,owned=!!S.survival.skills[id];return `<div class="skill"><b>${name}</b><small>${cost?cost.toLocaleString('ru-RU'):'ветка'}</small><button class="btn" ${owned?'disabled':''} onclick="buySkill('${id}',${cost})">${owned?'Куплено':'Купить'}</button></div>`}
function buySkill(id,cost){if(S.survival.skills[id])return;if(cost&&(S.survival.progress||0)<cost)return;S.survival.progress=Math.max(0,(S.survival.progress||0)-cost);S.survival.skills[id]=true;save();survivalSkills()}
function depositSurvival(){const n=Math.max(0,Math.floor(S.survival.money||0));S.survival.progress=Math.min(1000000,(S.survival.progress||0)+n);S.survival.money=0;S.survival.claimed=(S.survival.claimed||0)+n;save();survivalSkills()}
function survivalPrestige(){if((S.survival.progress||0)<10000)return;S.survival.money=0;S.survival.progress=0;S.survival.prestige++;S.survival.prestigeBonus=2;S.survival.claimed=0;save();survivalSkills()}
function updateEventBar(){const e=S.event;const bar=$('eventbar');if(!e||!e.type){bar.textContent='⏱️ Следующий ивент через '+fmt(Math.max(0,e?e.next-Date.now():300000));return}bar.innerHTML='🎯 Ивент идёт: <b>'+eventName(e.type)+'</b> <button class="btn" id="eventOpen" style="padding:5px 8px;min-height:32px">Ивенты</button>';if($('eventOpen'))$('eventOpen').onclick=eventModal}
function eventName(t){return {meteor:'Метеориты',dark:'Затемнение',magnet:'Магнит',scanner:'Сканер',overload:'Перегрузка'}[t]||t}
function startGlobalEvent(){if(S.event.type)return;const list=['meteor','dark','magnet','scanner','overload'];S.event.type=list[Math.floor(Math.random()*list.length)];S.event.started=Date.now();S.event.state={};save();eventModal();}
function eventModal(){
  const t=S.event.type;
  if(!t)return;
  let old=$('eventFloat'); if(old)old.remove();
  let body='';
  if(t==='meteor') body=`<div><b>На кнопку напали метеориты, спаси её.</b><p>Огнетушитель — 100 ₽. После покупки зажми главную кнопку на 5 секунд.</p><button class="btn" onclick="buyEventItem('extinguisher',100)">Купить огнетушитель</button><div id="eventProgress" class="notice"></div></div>`;
  if(t==='dark') body=`<div><b>Затемнение</b><p>Купи фонарик и сделай 1 000 тапов за 30 секунд.</p><button class="btn" onclick="buyEventItem('flashlight',1000)">Купить фонарик</button><div id="eventProgress" class="notice"></div></div>`;
  if(t==='magnet') body=`<div><b>Магнит</b><p>Кнопка убегает. Сделай 100 тапов за 30 секунд.</p><button class="btn" onclick="buyEventItem('magnet',1000)">Купить магнит</button><div id="eventProgress" class="notice"></div></div>`;
  if(t==='scanner') body=`<div><b>📡 Сканер</b><p>Среди кнопок одна настоящая.</p><button class="btn" onclick="scannerReveal()">Сканировать</button><div id="scanArea" class="grid" style="margin-top:8px"></div></div>`;
  if(t==='overload') body=`<div><b>⚡ Перегрузка</b><p>Сделай 150 тапов за 30 секунд. Поражение: −100 ₽.</p><div id="eventProgress" class="notice"></div></div>`;
  const d=document.createElement('div'); d.id='eventFloat'; d.className='eventpanel'; d.style.position='fixed';d.style.left='50%';d.style.top='14px';d.style.transform='translateX(-50%)';d.style.width='min(560px,92vw)';d.style.zIndex='90';d.style.boxShadow='0 18px 50px #0009';d.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>🎯 ${eventName(t)}</b><button class="x" style="width:36px;height:36px" onclick="closeEventFloat()">✕</button></div>${body}`;document.body.appendChild(d);
  if(t==='overload')startOverload();
  if(t==='meteor')document.body.classList.add('fire');
  if(t==='dark')document.body.classList.add('darkmode');
}
function closeEventFloat(){const x=$('eventFloat');if(x)x.remove()}
function eventProgressText(){const e=$('eventProgress');if(!e||!S.event.type)return;let st=S.event.state||{};if(S.event.type==='meteor')e.textContent=st.extinguisher?(st.hold>=5000?'Готово!':'Удерживай кнопку: '+Math.floor((st.hold||0)/1000)+'/5 сек'):'Купи огнетушитель';if(S.event.type==='dark')e.textContent=st.flashlight?'Тапов: '+(st.taps||0)+'/1000':'Купи фонарик';if(S.event.type==='magnet')e.textContent=st.magnet?'Тапов: '+(st.taps||0)+'/100':'Купи магнит';if(S.event.type==='overload')e.textContent='Тапов: '+(st.taps||0)+'/150'}
function buyEventItem(k,cost){if(S.rubles<cost)return;S.rubles-=cost;S.totalSpent+=cost;S.event.state=S.event.state||{};S.event.state[k]=true;S.event.state.taps=0;save();eventProgressText();if(k==='magnet')moveEventButton()}
function moveEventButton(){const b=$('mainTap');if(!b)return;b.style.transform=`translate(${Math.random()*120-60}px,${Math.random()*100-50}px)`}
function scannerReveal(){const area=$('scanArea');let good=Math.floor(Math.random()*6);area.innerHTML=Array.from({length:6},(_,i)=>`<button class="btn" id="scan${i}">${i===good?'НАЖМИ МЕНЯ':'Кнопка'}</button>`).join('');$('scan'+good).onclick=()=>finishEvent(true)}
function startOverload(){S.event.state=S.event.state||{};S.event.state.started=true;mode='event';const b=$('mainTap');if(b){b.onclick=()=>{S.event.state.taps=(S.event.state.taps||0)+1;eventProgressText();if(S.event.state.taps>=150)finishEvent(true)}};document.body.classList.add('overload');}
function finishEvent(win){let t=S.event.type, reward=t==='meteor'?10000:t==='magnet'?18000:t==='overload'?25000:t==='scanner'?20000:0;if(win){S.rubles+=reward;S.totalEarned+=reward;S.stats.eventsWon++;playSound('win')}else if(t==='overload'){S.rubles=Math.max(0,S.rubles-100);S.totalSpent+=Math.min(100,S.rubles)}S.event={type:null,started:0,next:Date.now()+300000,state:{}};document.body.classList.remove('overload','fire','darkmode');mode='main';const b=$('mainTap');if(b)b.style.transform='';closeEventFloat();save();renderMain()}
function tickEvent(){if(S.event.type){let dur=S.event.type==='meteor'?60000:30000;if(Date.now()-S.event.started>=dur){finishEvent(false);return}if(S.event.type==='dark')document.body.classList.add('darkmode');if(S.event.type==='magnet'&&S.event.state.magnet&&mode==='main')moveEventButton();if(S.event.type==='meteor'&&S.event.state.extinguisher&&S.event.state.holding){S.event.state.hold=Date.now()-S.event.state.holding;if(S.event.state.hold>=5000)finishEvent(true)}eventProgressText()}else if(Date.now()>=S.event.next){startGlobalEvent()}updateEventBar()}
function eventTapHandler(){if(!S.event.type)return false;let st=S.event.state;if(S.event.type==='meteor'){if(st.extinguisher){st.hold=st.hold||0;return true}return true}if(S.event.type==='dark'){if(st.flashlight){st.taps=(st.taps||0)+1;if(st.taps>=1000)finishEvent(true)}return true}if(S.event.type==='magnet'){if(st.magnet){st.taps=(st.taps||0)+1;if(st.taps>=100)finishEvent(true);moveEventButton()}return true}return true}
// Unified main-button handler: normal clicks always use doTap; active events intercept only their own mechanics.
function bindMain(){
  const b=$('mainTap');
  if(!b)return;
  b.onclick=null;
  b.onpointerdown=null;
  b.onpointerup=null;
  b.onclick=()=>{
    if(mode!=='main') return;
    if(S.event && S.event.type && $('eventFloat')){
      const st=S.event.state||{};
      if(S.event.type==='overload'){
        st.taps=(st.taps||0)+1; S.event.state=st; eventProgressText();
        if(st.taps>=150)finishEvent(true);
        return;
      }
      if(S.event.type==='dark'&&st.flashlight){
        st.taps=(st.taps||0)+1; S.event.state=st; eventProgressText();
        if(st.taps>=1000)finishEvent(true);
        return;
      }
      if(S.event.type==='magnet'&&st.magnet){
        st.taps=(st.taps||0)+1; S.event.state=st; eventProgressText();
        if(st.taps>=100)finishEvent(true); else moveEventButton();
        return;
      }
      if(S.event.type==='meteor'&&st.extinguisher)return;
    }
    doTap();
  };
  b.onpointerdown=()=>{
    if(S.event&&S.event.type==='meteor'&&S.event.state&&S.event.state.extinguisher&&$('eventFloat')){
      S.event.state.holding=Date.now(); eventProgressText();
    }
  };
  b.onpointerup=()=>{
    if(S.event&&S.event.type==='meteor'&&S.event.state&&S.event.state.extinguisher&&$('eventFloat')){
      const held=Date.now()-(S.event.state.holding||Date.now());
      S.event.state.holding=0; S.event.state.hold=held; eventProgressText();
      if(held>=5000)finishEvent(true);
    }
  };
}

const oldRenderMain=renderMain;renderMain=function(){oldRenderMain();bindMain();}
resetTasksIfNeeded();updateTasks();updateAchievements();renderMain();if(S.event.type)eventModal();setInterval(()=>{resetTasksIfNeeded();updateTasks();tickEvent()},1000);save();
</script>
</body></html>
