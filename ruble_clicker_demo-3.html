<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Рублёвый кликер — демо</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:#111827;color:#fff;display:grid;place-items:center;min-height:100vh}
  .card{width:min(420px,92vw);background:#1f2937;border-radius:24px;padding:24px;text-align:center;box-shadow:0 20px 60px #0006}
  h1{margin:0 0 8px}.hint{color:#9ca3af;font-size:14px}
  input{width:100%;padding:14px;border:0;border-radius:12px;margin:18px 0 10px;font-size:16px}
  button{border:0;border-radius:50%;width:190px;height:190px;background:#f59e0b;color:#111827;font-size:28px;font-weight:800;cursor:pointer;box-shadow:0 10px 0 #b45309;transition:.08s}
  button:active{transform:translateY(7px);box-shadow:0 3px 0 #b45309}
  .balance{font-size:42px;font-weight:800;margin:22px 0 6px}.count{color:#d1d5db}
  .note{margin-top:18px;font-size:12px;color:#9ca3af;line-height:1.4}
</style>
</head>
<body>
<div class="card">
  <h1>💰 Рублёвый кликер</h1>
  <div class="hint">Каждый тап = 1 ₽</div>
  
  <div class="balance" id="balance">0 ₽</div>
  <div class="count">Тапов: <span id="count">0</span></div>
  <button id="tap">ТАП</button>
  <div class="note">Это учебный прототип. Деньги реально не переводятся, SMS не отправляются, а номер телефона никуда не передаётся.</div>
</div>
<script>
let taps = Number(localStorage.getItem('rubleClickerTaps') || 0);
const balance = document.getElementById('balance');
const count = document.getElementById('count');

function update() {
  balance.textContent = taps + ' ₽';
  count.textContent = taps;
}

update();

document.getElementById('tap').addEventListener('click', () => {
  taps++;
  localStorage.setItem('rubleClickerTaps', taps);
  update();
});
</script>
</body>
</html>
